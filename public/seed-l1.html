<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>在 Landed 链上发布示例需求</title>
<style>body{font:16px/1.7 system-ui,-apple-system,"PingFang SC",sans-serif;background:#FAF6F0;color:#2A2420;margin:0;padding:48px 16px}main{max-width:620px;margin:0 auto}h1{font-size:26px;margin:0 0 8px}p{color:#7A6E64}button{font:600 16px system-ui;background:#2A2420;color:#fff;border:0;border-radius:999px;padding:14px 26px;cursor:pointer}button:disabled{opacity:.5}ol{padding-left:20px}li.ok{color:#2E9E5B}li.err{color:#D64545}pre{background:#fff;border:1px solid #E6DCCF;border-radius:8px;padding:14px;white-space:pre-wrap;word-break:break-all;font-size:13px}</style></head>
<body><main><h1>在 Landed 专属链上发布示例需求</h1>
<p>用当前钱包账户发布 7 个示例需求（和 Fuji 上的一样），共锁定 5,280 测试 USDC。钱包会依次弹出确认：可能有领测试币、授权各 1 次，然后每个需求 1 次。全部点 Approve 即可，过程中不要关闭页面。</p>
<button id="go">开始发布</button>
<ol id="log"></ol></main>
<script src="vendor/ethers.umd.min.js"></script>
<script>
const CHAIN={chainId:"0x1b27e",chainName:"Landed",nativeCurrency:{name:"LUSD",symbol:"LUSD",decimals:18},rpcUrls:["https://nodes-prod.43.207.73.245.sslip.io/ext/bc/2qfQ4qWMPmnUQgKx6zaUupAcmrnAHTeLocH9NsoxfU5oaygT5H/rpc"]};
const DAY=86400,usd=n=>ethers.parseUnits(String(n),6);
const JOBS=[
["Brand identity for a Berlin coffee roastery","We are opening our second shop and need a full identity: logo, colour palette, cup and bag packaging. Warm, hand-made feel. Please share 2-3 past identity projects.","Design",[["Moodboard & 3 logo directions",300],["Final logo + palette",500],["Packaging (cup, bag, sticker)",400]]],
["Marketing site for an AI note-taking app","Next.js + Tailwind landing page with pricing, blog and waitlist. Figma is ready. Must be fast and responsive.","Development",[["Home + pricing pages",800],["Blog, waitlist, launch",700]]],
["30-second podcast intro music","Upbeat lo-fi intro and outro for a weekly tech podcast. Need stems and full commercial rights.","Music",[["Two demo directions",150],["Final mix + stems",150]]],
["Localise a fitness app UI into Simplified Chinese","About 2,400 strings, natural tone for mainland users. Glossary provided.","Translation",[["Full translation",200]]],
["Product explainer video, 60s, motion graphics","Explain our invoicing product in 60 seconds. Script is done, need storyboard and animation.","Video",[["Storyboard",250],["Animation v1",450],["Final with voiceover",300]]],
["YouTube channel editing · 4 episodes","Edit four 15-minute episodes: cuts, captions in EN/ZH, thumbnail.","Video",[["Episode 1",120],["Episode 2",120],["Episode 3",120],["Episode 4",120]]],
["Illustration set for a children's book cover","Cover plus 6 spot illustrations.","Design",[["Sketches",250],["Final artwork",350]]]];
const log=(t,c="")=>{const li=document.createElement("li");li.textContent=t;li.className=c;document.getElementById("log").append(li);return li};
document.getElementById("go").onclick=async()=>{const b=document.getElementById("go");b.disabled=true;
try{const eth=window.avalanche||window.ethereum;if(!eth)throw new Error("没有检测到钱包");
await eth.request({method:"eth_requestAccounts"});
try{await eth.request({method:"wallet_switchEthereumChain",params:[{chainId:CHAIN.chainId}]})}catch(e){await eth.request({method:"wallet_addEthereumChain",params:[CHAIN]})}
const p=new ethers.BrowserProvider(eth);if((await p.getNetwork()).chainId!==111230n)throw new Error("钱包当前不在 Landed 链");
const s=await p.getSigner(),me=await s.getAddress();
const C=await (await fetch("config-l1.json?"+Date.now())).json();
const U=new ethers.Contract(C.usdc,C.usdcAbi,s),L=new ethers.Contract(C.landed,C.landedAbi,s);
const need=usd(5280);log("已连接 "+me,"ok");
if((await U.balanceOf(me))<need){const li=log("领取测试 USDC…");await (await U.faucet()).wait();li.textContent="已领取 1 万测试 USDC";li.className="ok"}
if((await U.allowance(me,C.landed))<need){const li=log("授权合约使用 USDC…");await (await U.approve(C.landed,ethers.MaxUint256)).wait();li.textContent="已授权";li.className="ok"}
const K="landed.seedl1."+me.toLowerCase();let done=0;try{done=+localStorage.getItem(K)||0}catch{}
for(const [i,[title,details,cat,ms]] of JOBS.entries()){if(i<done){log(`已发布过 ${i+1}/7：${title}`,"ok");continue}const li=log(`发布 ${i+1}/7：${title}…`);
await (await L.postJob(title,details,cat,C.usdc,ms.map(m=>m[0]),ms.map(m=>usd(m[1])),3*DAY)).wait();li.textContent=`已发布 ${i+1}/7：${title}`;li.className="ok";try{localStorage.setItem(K,i+1)}catch{}}
log("全部完成！回到网站需求广场刷新即可看到","ok")
}catch(e){log("出错："+(e.shortMessage||e.message)+"（可以再点一次按钮，已发布的不会重复）","err");b.disabled=false}};
</script></body></html>
